name: Foundation and knowledge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: scoat
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: scoat
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U scoat" --health-interval 1s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://scoat:fixture-only@localhost:5432/scoat
      SCOAT_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed -- --fixture ci-p01
      - run: npm run db:seed -- --fixture ci-p01
      - run: npm run verify -- p01
      - run: npm run perf -- p01
      - run: npm run verify -- p02
      - run: npm run perf -- p02
      - run: npm run verify -- p03
      - run: npm run perf -- p03
      - run: npm run verify -- p04
      - run: npm run perf -- p04
      - run: npm run verify -- p05
      - run: npm run perf -- p05
      - run: npx playwright install --with-deps chromium
      - run: npm run verify -- p06
      - run: npm run perf -- p06
      - run: npm run verify -- p07-controls
      - run: npm run verify -- p07-card
      - run: npm run verify -- p08
      - run: npm run perf -- p08
      - name: Install official PGDG PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - run: npm run verify -- p09-lineage
      - run: npm run verify -- p09-recovery
      - name: Provide the systemd Node executable
        run: sudo ln -sfn "$(command -v node)" /usr/bin/node
      - run: npm run verify -- p09-operations
      - run: npm run perf -- p09
      - name: Install ffmpeg for P09 story media
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run verify -- p09
