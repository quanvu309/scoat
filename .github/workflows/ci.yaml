name: Foundation and knowledge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: scoat
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: scoat
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U scoat" --health-interval 1s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://scoat:fixture-only@localhost:5432/scoat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed -- --fixture ci-p01
      - run: npm run db:seed -- --fixture ci-p01
      - run: npm run verify -- p01
      - run: npm run perf -- p01
      - run: npm run verify -- p02
      - run: npm run perf -- p02
      - run: npm run verify -- p03
      - run: npm run perf -- p03
      - run: npm run verify -- p04
      - run: npm run perf -- p04
      - run: npm run verify -- p05
      - run: npm run perf -- p05
      - run: npx playwright install --with-deps chromium
      - run: npm run verify -- p06
      - run: npm run perf -- p06
      - run: npm run verify -- p08
      - run: npm run perf -- p08
