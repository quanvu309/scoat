services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: scoat
      POSTGRES_PASSWORD: fixture-only
      POSTGRES_DB: scoat
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    healthcheck:
      test: [CMD-SHELL, pg_isready -U scoat -d scoat]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - db:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
  fixture-shop:
    image: node:24.21.0-alpine
    command: [node, /fixture/shop.mjs]
    volumes:
      - ./fixtures/shop.mjs:/fixture/shop.mjs:ro
    ports:
      - "127.0.0.1:${SHOP_PORT:-8089}:8080"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  db:
